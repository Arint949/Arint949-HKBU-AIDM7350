<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClimaXtreme | Method</title>
  <link rel="stylesheet" href="method_CSS.css">
</head>
<body>
  <div class="container">
    <!-- 顶栏：搜索栏 + 返回首页 -->
    <header>
      <div class="top-bar">
        <p class="content-title">措施 / Method</p>
        <div class="search-container">
        <input type="text" class="search-input" placeholder="搜索 / Search...">
        </div>        
        <a href="../Home/home.html" class="home-link">
          <img src="../BackHome.jpg" alt="主页图标" class="home-icon">
        </a>
      </div>
    </header>

    <!-- 并排竖条标签区 -->
    <div class="weather-tags">
      <div class="tag-item" data-bg="1.png" data-type="rain">
        <p>暴雨</p>
        <small>/Rainstorm</small>
      </div>
      <div class="tag-item" data-bg="2.png" data-type="temp">
        <p>高温</p>
        <small>/Scorching</small>
      </div>
      <div class="tag-item" data-bg="3-1.png" data-type="typhoon">
        <p>台风</p>
        <small>/Typhoon</small>
      </div>
      <div class="tag-item" data-bg="4.png" data-type="freezing">
        <p>寒潮</p>
        <small>/Freezing</small>
      </div>
      <div class="tag-item" data-bg="5.png" data-type="convection">
        <p>强对流</p>
        <small>/Convection</small>
      </div>
      <div class="tag-item" data-bg="6.png" data-type="dry">
        <p>干旱</p>
        <small>/Dry</small>
      </div>
      <div class="tag-item" data-bg="7.png" data-type="sandstorm">
        <p>沙尘暴</p>
        <small>/Sandstorm</small>
      </div>
    </div>

    <!-- 内容展开栏 -->
    <div class="text">
      <div class="text-title">
        <div class="title-bg"></div>
      </div>
      <ul class="method-list">
        <!-- JS 动态填充措施内容 -->
      </ul>
    </div>
  </div>

  <!-- 链接放在container外，作为独立固定元素 -->
  <a href="../Info/Info.html" class="detail-link">点击查看相关讯息 / Click to view news  >>></a>

  <script src="method_js.js"></script>
</body>
</html>
