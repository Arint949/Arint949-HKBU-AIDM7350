<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClimaXtreme | Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="home_style.css">
  
  <!-- 顶栏：搜索栏 + 导航标 -->
  <header>
    <div class="top-bar">
      <div class="search-container">
        <input type="text" class="search-input" placeholder="搜索 / Search...">
      </div>
      <button class="menu-btn"><i class="fa-solid fa-bars"></i></button>
    </div>
  </header>

  <!-- 侧边：导航栏 -->
  <div class="sidebar">
    <a href="../Info/Info.html"><i class="fa-solid fa-newspaper"></i>资讯 / Info（无内容）</a>
    <a href="../Data/data.html"><i class="fa-solid fa-chart-line"></i>数据 / Data（无内容）</a>
    <a href="../Method/method.html"><i class="fa-solid fa-shield"></i>措施 / Method（点击跳转）</a>
  </div>

  <!-- 遮罩层 -->
  <div class="cover"></div>

  <!-- 网站名称（重要！！！） -->
  <main>
    <h1 class="title">ClimaXtreme</h1>
  </main>

  <!-- 底栏：天气信息 -->
  <footer>
    <div class="weather-info">
      <div class="weather-item">
        <i class="fa-solid fa-map-marker"></i>
        <span id="location">正在获取位置...</span>
      </div>
      <div class="weather-item">
        <i class="fa-solid fa-thermometer-half"></i>
        <span id="temp">--</span>
      </div>
      <div class="weather-item">
        <i class="fa-solid fa-cloud"></i>
        <span id="condition">--</span>
      </div>
      <div class="weather-item">
        <i class="fa-solid fa-temperature-high"></i>
        <span id="high-low">↑-- ↓--</span>
      </div>
    </div>
  </footer>

  <script src="home_js.js"></script>
</body>
</html>
